<!doctype html><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@600&display=swap" rel="stylesheet">
<style>
  /* One Dark store icon — 128×128, full-bleed (Chrome applies its own masking). */
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:128px;height:128px;overflow:hidden}
  body{
    background:#21252b;
    font-family:'Geist',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;
  }
  /* The frame-over-toolbar step is the theme's identity, so the mark is literally
     that step: a toolbar-coloured plate sitting on the frame. */
  .plate{
    width:106px;height:106px;border-radius:24px;background:#282c34;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    box-shadow:0 3px 10px rgba(0,0,0,.3);
  }
  .od{font-size:40px;font-weight:600;letter-spacing:-1.6px;color:#dcdfe4;line-height:1}
  .rule{width:30px;height:4px;border-radius:2px;background:#61afef}
</style>
<div class="plate">
  <div class="od">OD</div>
  <div class="rule"></div>
</div>
