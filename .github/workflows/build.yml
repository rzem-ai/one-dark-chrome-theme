name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate manifest
        run: node scripts/validate-theme.mjs theme/manifest.json

      - name: Package
        run: ./scripts/package.sh

      - name: Read theme version
        id: theme
        run: echo "version=$(node -p 'require("./theme/manifest.json").version')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: one-dark-${{ steps.theme.outputs.version }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    # Releases come from a push to main, tagged v<manifest version>, or from an
    # explicit v* tag push. Either way theme/manifest.json is the source of truth
    # for the version, and a version that is already released is a no-op — so
    # main is only published when the manifest has actually been bumped.
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Resolve version
        run: |
          version=$(node -p 'require("./theme/manifest.json").version')
          # A tag whose version disagrees with the manifest would ship a zip the
          # Web Store rejects as a duplicate version, so fail before publishing.
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match theme/manifest.json version $version — bump the manifest or retag"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_ENV"
          echo "tag=v$version" >> "$GITHUB_ENV"

      - name: Check for an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::$tag is already released — bump theme/manifest.json to publish a new version"
            echo "skip=true" >> "$GITHUB_ENV"
          fi

      - name: Package
        if: env.skip != 'true'
        run: ./scripts/package.sh

      - name: Publish release
        if: env.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$tag" "dist/one-dark-${version}.zip" \
            --target "$GITHUB_SHA" \
            --title "One Dark ${version}" \
            --notes "Chrome theme, version ${version}. Download the zip and upload it at https://chrome.google.com/webstore/devconsole, or unzip and load it unpacked via chrome://extensions."
